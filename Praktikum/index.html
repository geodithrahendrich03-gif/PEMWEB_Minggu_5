<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Parts Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">PC PARTS STORE</div>
        <ul class="menu">
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>

    <main class="container">
        <section id="home" class="hero">
            <h2>Upgrade PC, Maksimalkan <span class="highlight">Performa</span>.</h2>
        </section>

        <section id="products">
            <h3>Products</h3>
            <div class="products">
                <div class="card">
                    <img src="images/ssd.jpg" alt="SSD">
                    <p>SSD</p>
                </div>
                <div class="card">
                    <img src="images/ram.jpg" alt="RAM">
                    <p>RAM</p>
                </div>
                <div class="card">
                    <img src="images/cpu.jpg" alt="Prosesor">
                    <p>Prosesor</p>
                </div>
                <div class="card">
                    <img src="images/gpu.jpg" alt="Kartu Grafis">
                    <p>Kartu Grafis</p>
                </div>
            </div>
        </section>

        <section id="about">
            <h3>About</h3>
            <p>Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
        </section>

    </main>

</body>
</html>
